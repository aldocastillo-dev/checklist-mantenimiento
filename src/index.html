<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReporteMtto</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Controles del prototipo: simulan la señal del teléfono y un envío alterado. El rol ya no se elige aquí: viene de la cuenta. -->
  <section id="protobar" aria-label="Controles del prototipo">
    <p class="proto-title">Prototipo · controles de simulación</p>
    <div class="proto-row">
      <label for="ctl-senal">Señal</label>
      <select id="ctl-senal" autocomplete="off">
        <option value="con">Con señal</option>
        <option value="sin">Sin señal</option>
      </select>
    </div>
    <div class="proto-row">
      <label for="ctl-poc">Envío</label>
      <select id="ctl-poc" autocomplete="off">
        <option value="normal">Normal</option>
        <option value="invalido">Con N° de OT inválido (PoC)</option>
      </select>
    </div>
  </section>

  <div id="sesion-bar" hidden></div>

  <main id="app" tabindex="-1"></main>

  <p id="toast" role="status" aria-live="polite"></p>

  <dialog id="doc-dialog" aria-labelledby="doc-title"></dialog>

  <script src="app.js"></script>
</body>
</html>
